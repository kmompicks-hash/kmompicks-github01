<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="kmom-size" content="1080x1080">
<link rel="stylesheet" href="../../../../tools/image-kit/kmom.css">
<style>
  body { background: #efe7dc; }
  .sheet { position: absolute; inset: 56px; background: var(--paper); border-radius: 40px; padding: 64px 64px 56px; display: flex; flex-direction: column; box-shadow: 0 16px 40px rgba(90,60,30,.10); }
  .tag { align-self: flex-start; background: var(--accent); color: #fff; font-weight: 800; font-size: 26px; padding: 10px 24px; border-radius: 999px; }
  .h { font-size: 60px; font-weight: 800; line-height: 1.3; margin-top: 30px; }
  .b { margin-top: 40px; flex: 1; display: flex; flex-direction: column; gap: 18px; justify-content: center; }
  .item { display: flex; align-items: center; gap: 22px; font-size: 34px; background: #f7f2ea; border-radius: 22px; padding: 24px 30px; line-height: 1.35; }
  .item .e { font-size: 44px; }
  .sign { margin-top: 28px; display: flex; justify-content: space-between; align-items: center; font-size: 24px; color: var(--sub); }
  .sign b { letter-spacing: .2em; color: var(--ink); } .sign b span { color: var(--accent); }
  code { font-family: Consolas, monospace; background: #1e1f24; color: #e8e2d8; padding: 2px 12px; border-radius: 8px; font-size: 30px; }
</style></head>
<body>
  <div class="sheet">
    <div class="tag">설치할 때 체크 칸</div>
    <div class="h">네모 칸 5개,<br><span class="accent">제가 고른 건요</span></div>
    <div class="b"><div class="item"><span class="e">⭐</span><span><b>PATH에 추가</b> → 무조건 켜기<br><small style="font-size:26px;color:var(--sub)">원래 켜져 있어요</small></span></div>
  <div class="item"><span class="e">👍</span><span><b>Code로 열기 2개</b> → 켜기<br><small style="font-size:26px;color:var(--sub)">원래 꺼져 있으니 직접 체크!</small></span></div>
  <div class="item"><span class="e">🙆‍♀️</span><span><b>편집기 등록</b> → 그대로 두기<br><b>바탕화면 아이콘</b> → 마음대로</span></div></div>
    <div class="sign"><b>KMOM <span>PICKS</span></b><span>케이맘의 AI 자동화 도전기</span></div>
  </div>
</body></html>
