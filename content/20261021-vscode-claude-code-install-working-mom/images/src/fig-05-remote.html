<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="kmom-size" content="1200x750">
<link rel="stylesheet" href="../../../../tools/image-kit/kmom.css">
<style>
  .wrap { margin-top: 34px; display: grid; grid-template-columns: 330px 1fr; gap: 56px; align-items: start; }
  .phone { width: 330px; height: 520px; border-radius: 44px; background: #111; padding: 14px; box-shadow: 0 24px 50px rgba(40,30,20,.25); }
  .screen { width: 100%; height: 100%; border-radius: 32px; background: #0b0f19; color: #f3f4f6; padding: 26px 20px; font-size: 15px; }
  .screen .h { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 19px; }
  .screen .h small { font-size: 12px; color: #4ade80; font-weight: 600; }
  .screen .box { margin-top: 18px; background: #1f2937; border-radius: 14px; padding: 14px; color: #9ca3af; line-height: 1.5; }
  .screen .chk { margin-top: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .screen .chk span { background: #1f2937; border-radius: 10px; padding: 9px 10px; font-size: 13px; }
  .screen .chk span::before { content: '☑ '; color: #a78bfa; }
  .screen .btn { margin-top: 18px; background: linear-gradient(90deg,#7c3aed,#4f46e5); border-radius: 14px; padding: 14px; text-align: center; font-weight: 800; }
  .flow { display: flex; flex-direction: column; gap: 16px; }
  .f { display: grid; grid-template-columns: 54px 1fr; gap: 18px; align-items: center; background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 18px 22px; }
  .f .n { width: 54px; height: 54px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 26px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .f b { font-size: 25px; display: block; } .f small { font-size: 19px; color: var(--sub); }
</style></head>
<body>
  <div class="frame" style="padding:56px 64px 48px">
    <div class="kicker">Kmom Picks Mobile Controller</div>
    <div class="title" style="font-size:44px;margin-top:18px">내 폰 속 <span class="accent">AI 리모컨</span> 쓰는 법</div>
    <div class="wrap">
      <div class="phone"><div class="screen">
        <div class="h">Kmom Picks <small>● Claude Ready</small></div>
        <div class="box">오늘의 주제 / 아이디어<br><span style="color:#e5e7eb">VS Code 설치 후기…</span></div>
        <div class="chk"><span>워드프레스</span><span>네이버</span><span>숏폼</span><span>카드뉴스</span></div>
        <div class="btn">CLI 명령어 자동 생성하기</div>
      </div></div>
      <div class="flow">
        <div class="f"><div class="n">1</div><div><b>주제 입력</b><small>손이 바쁘면 🎤 음성 입력</small></div></div>
        <div class="f"><div class="n">2</div><div><b>만들 콘텐츠 체크</b><small>워드프레스 · 네이버 · 숏폼 · 카드뉴스</small></div></div>
        <div class="f"><div class="n">3</div><div><b>명령어 생성 → 복사</b><small>클로드 코드에 넣을 문장이 뚝딱</small></div></div>
        <div class="f"><div class="n">4</div><div><b>PC 터미널에 붙여넣기</b><small>콘텐츠 작업 시작!</small></div></div>
      </div>
    </div>
  </div>
</body></html>
