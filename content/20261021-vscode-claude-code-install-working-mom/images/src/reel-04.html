<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="kmom-size" content="1080x1920">
<link rel="stylesheet" href="../../../../tools/image-kit/kmom.css">
<style>
  /* 인스타 릴스 화면에서 위 220px·아래 420px 은 버튼·캡션이 덮으니 글자는 그 사이에 둔다 */
  .safe { position: absolute; left: 80px; right: 80px; top: 240px; bottom: 440px; display: flex; flex-direction: column; justify-content: center; }
  .step { font-size: 30px; font-weight: 800; color: var(--accent); letter-spacing: .12em; }
  .big { font-size: 96px; font-weight: 800; line-height: 1.22; margin-top: 28px; }
  .small { font-size: 44px; color: #3b3f45; line-height: 1.5; margin-top: 40px; }
  .vis { margin-top: 64px; }
  .term { background: #1e1f24; border-radius: 28px; padding: 40px 44px; font-family: Consolas, monospace; font-size: 40px; color: #e8e2d8; line-height: 1.6; }
  .g { color: #d9a877; } .cur { display: inline-block; width: 20px; height: 42px; background: #e8e2d8; vertical-align: -7px; }
  .brandline { position: absolute; left: 80px; top: 120px; font-size: 26px; font-weight: 800; letter-spacing: .2em; }
  .brandline span { color: var(--accent); }
</style></head>
<body>
  <div class="brandline">KMOM <span>PICKS</span></div>
  <div class="safe">
    <div class="step">STEP 3 · 깃허브</div>
    <div class="big">😱 디자인<br><span class="accent">어디 갔어?</span></div>
    <div class="small">비공개로 했더니 글자만 줄줄이…<br>무료 깃허브는 <b>공개</b> 보관함이어야<br>홈페이지 기능을 쓸 수 있대요</div>
    <div class="vis"></div>
  </div>
</body></html>
