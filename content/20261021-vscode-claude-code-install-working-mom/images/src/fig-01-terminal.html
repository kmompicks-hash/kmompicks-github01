<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="kmom-size" content="1200x750">
<link rel="stylesheet" href="../../../../tools/image-kit/kmom.css">
<style>
  .vs { margin-top: 36px; flex: 1; display: grid; grid-template-rows: 1fr 250px; border-radius: 20px; overflow: hidden; border: 1px solid var(--line); box-shadow: 0 18px 40px rgba(60,40,20,.12); }
  .editor { background: #fbfaf7; display: grid; grid-template-columns: 210px 1fr; }
  .side { background: #f0ece5; padding: 22px; font-size: 19px; color: var(--sub); line-height: 2; }
  .doc { padding: 26px 30px; font-size: 21px; color: #9a958c; line-height: 1.9; }
  .term { background: #1e1f24; padding: 22px 30px; position: relative; font-family: Consolas, monospace; color: #e8e2d8; font-size: 24px; }
  .term .tab { font-family: Pretendard, sans-serif; font-size: 17px; color: #9aa0a6; margin-bottom: 16px; letter-spacing: .05em; }
  .term .tab b { color: #fff; border-bottom: 2px solid var(--accent); padding-bottom: 4px; }
  .g { color: #d9a877; }
  .cur { display: inline-block; width: 13px; height: 26px; background: #e8e2d8; vertical-align: -5px; }
  .note { position: absolute; font-family: Pretendard, sans-serif; background: var(--accent); color: #fff; font-size: 20px; font-weight: 700; padding: 10px 18px; border-radius: 12px; }
</style></head>
<body>
  <div class="frame" style="padding:56px 64px 48px">
    <div class="kicker">검은 화면의 정체</div>
    <div class="title" style="font-size:44px;margin-top:18px">터미널 = 글자로 <span class="accent">부탁하는 창</span></div>
    <div class="vs">
      <div class="editor">
        <div class="side">📁 내 폴더<br>📄 원고.html<br>📄 메모.txt</div>
        <div class="doc">VS Code 위쪽은 글을 쓰는 곳,<br>아래쪽 검은 칸이 '터미널'이에요.</div>
      </div>
      <div class="term">
        <div class="tab"><b>터미널</b> &nbsp;&nbsp; 문제 &nbsp;&nbsp; 출력</div>
        <div><span class="g">PS C:\Users\kmom&gt;</span> <span class="cur"></span></div>
        <div class="note" style="left:30px;bottom:24px">↑ 지금 내가 있는 폴더 위치</div>
        <div class="note" style="right:30px;bottom:24px;background:var(--ink)">열기: Ctrl + `</div>
      </div>
    </div>
  </div>
</body></html>
