<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="kmom-size" content="1080x1080">
<link rel="stylesheet" href="../../../../tools/image-kit/kmom.css">
<style>
  body { background: #efe7dc; }
  .sheet { position: absolute; inset: 56px; background: var(--paper); border-radius: 40px; padding: 72px 68px 60px; display: flex; flex-direction: column; overflow: hidden; }
  .tag { align-self: flex-start; background: var(--accent); color: #fff; font-weight: 800; font-size: 28px; padding: 10px 26px; border-radius: 999px; }
  .h { font-size: 82px; font-weight: 800; line-height: 1.22; margin-top: 44px; }
  .s { font-size: 36px; color: var(--sub); margin-top: 28px; line-height: 1.45; }
  .term { margin-top: auto; background: #1e1f24; border-radius: 24px; padding: 30px 34px; font-family: Consolas, monospace; font-size: 30px; color: #e8e2d8; line-height: 1.7; }
  .g { color: #d9a877; } .cur { display: inline-block; width: 15px; height: 30px; background: #e8e2d8; vertical-align: -5px; }
  .sign { margin-top: 26px; display: flex; justify-content: space-between; font-size: 24px; color: var(--sub); }
  .sign b { letter-spacing: .2em; color: var(--ink); } .sign b span { color: var(--accent); }
</style></head>
<body>
  <div class="circle" style="width:420px;height:420px;right:-120px;top:-120px"></div>
  <div class="sheet">
    <div class="tag">AI 자동화 도전기 1탄</div>
    <div class="h">컴맹 46세 엄마,<br><span class="accent">까만 화면</span>을<br>켜다 😳</div>
    <div class="s">VS Code · 클로드 코드 설치부터<br>폰 리모컨 완성까지</div>
    <div class="term"><span class="g">PS C:\kmom&gt;</span> 무서워하지 마세요<br><span class="g">&gt;</span> <span class="cur"></span></div>
    <div class="sign"><b>KMOM <span>PICKS</span></b><span>네이버 블로그</span></div>
  </div>
</body></html>
