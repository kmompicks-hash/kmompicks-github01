<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="kmom-size" content="1200x750"><link rel="stylesheet" href="../../../../tools/image-kit/kmom.css"><style>:root{--tomato:#c8463a;--tomato-soft:#f7e2dd}</style>
<style>.g{margin-top:44px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.c{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:36px 28px;text-align:center}.c .i{font-size:68px}.c b{display:block;font-size:32px;margin-top:14px}.c p{font-size:22px;color:var(--sub);margin-top:12px;line-height:1.5}.note{margin-top:30px;background:var(--tomato-soft);border-radius:16px;padding:18px 26px;font-size:23px}</style></head><body>
<div class="frame" style="padding:56px 64px 48px"><div class="kicker">우리 가족이 마셔 본 맛</div>
<div class="title" style="font-size:44px;margin-top:18px">진하지 않고 <span style="color:var(--tomato)">순한 맛</span></div>
<div class="g"><div class="c"><div class="i">🍅</div><b>순해요</b><p>진하고 강한 맛이 아니라<br>처음 마셔도 부담 없음</p></div>
<div class="c"><div class="i">🙆‍♀️</div><b>비린 맛 거의 없음</b><p>토마토 특유의 텁텁함·<br>비릿함이 거의 없어요</p></div>
<div class="c"><div class="i">💧</div><b>가벼운 목넘김</b><p>걸쭉하지 않아<br>물처럼 가볍게</p></div></div>
<div class="note">👨 남편이 가장 마음에 들어 한 점: <b>비린 맛이 거의 없다는 것</b></div></div></body></html>
