<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="kmom-size" content="1080x1080">
<link rel="stylesheet" href="../../../../tools/image-kit/kmom.css">
<style>:root{--tomato:#c8463a;--tomato-soft:#f7e2dd}body{background:#f3e3dc}.sheet{position:absolute;inset:56px;background:var(--paper);border-radius:40px;padding:64px 64px 56px;display:flex;flex-direction:column;box-shadow:0 16px 40px rgba(120,50,30,.10)}.tag{align-self:flex-start;background:var(--tomato);color:#fff;font-weight:800;font-size:26px;padding:10px 24px;border-radius:999px}.h{font-size:60px;font-weight:800;line-height:1.3;margin-top:30px}.h em{font-style:normal;color:var(--tomato)}.b{margin-top:40px;flex:1;display:flex;flex-direction:column;gap:18px;justify-content:center}.item{display:flex;align-items:center;gap:22px;font-size:34px;background:#faf1ec;border-radius:22px;padding:24px 30px;line-height:1.35}.item .e{font-size:44px}.sign{margin-top:28px;display:flex;justify-content:space-between;font-size:24px;color:var(--sub)}.sign b{letter-spacing:.2em;color:var(--ink)}.sign b span{color:var(--accent)}</style></head>
<body><div class="sheet"><div class="tag">우리 집 활용법</div><div class="h">이렇게<br><em>세 가지</em>로 마셔요</div><div class="b"><div class="item"><span class="e">🌅</span><span>① 아침 빈속에 한 잔</span></div><div class="item"><span class="e">🧒</span><span>② 아이 간식 대신 한 잔</span></div><div class="item"><span class="e">🍳</span><span>③ 요리에 토마토소스 대신</span></div></div><div class="sign"><b>KMOM <span>PICKS</span></b><span>케이맘의 내돈내산 기록</span></div></div></body></html>
