<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kmom Picks Mobile Controller</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 max-w-md mx-auto">

    <!-- Header -->
    <header class="w-full flex items-center justify-between py-4 border-b border-gray-800 mb-6">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-purple-500/30">
                <i class="fa-solid fa-bolt text-white text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-tight text-white">Kmom Picks</h1>
                <p class="text-xs text-purple-400 font-medium">Mobile Controller</p>
            </div>
        </div>
        <div class="flex items-center space-x-2 bg-gray-900 border border-gray-800 px-3 py-1.5 rounded-full">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span class="text-xs text-gray-300 font-medium">Claude Ready</span>
        </div>
    </header>

    <!-- Main Controller Card -->
    <main class="w-full flex-1 flex flex-col space-y-6">
        
        <!-- Topic Input Section -->
        <div class="bg-gray-900/80 border border-gray-800/80 rounded-2xl p-5 shadow-xl backdrop-blur-md">
            <div class="flex items-center justify-between mb-3">
                <label class="text-sm font-semibold text-gray-200 flex items-center space-x-2">
                    <i class="fa-regular fa-lightbulb text-amber-400"></i>
                    <span>오늘의 주제 / 아이디어</span>
                </label>
                <button onclick="startVoiceInput()" class="text-xs text-gray-400 hover:text-purple-400 bg-gray-800 px-2.5 py-1 rounded-lg border border-gray-700 transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-microphone text-purple-400"></i>
                    <span>음성 입력</span>
                </button>
            </div>
            <textarea id="topicInput" rows="3" 
                class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3.5 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-purple-500 transition resize-none"
                placeholder="예: 6세 아이 추천 영양제 내돈내산 비교 및 후기"></textarea>
        </div>

        <!-- Post Type Section -->
        <div class="bg-gray-900/80 border border-gray-800/80 rounded-2xl p-5 shadow-xl">
            <span class="text-sm font-semibold text-gray-200 block mb-3">글 종류:</span>
            <div class="grid grid-cols-2 gap-3" id="typeGroup">
                <label class="type-opt col-span-2 flex items-center space-x-2 bg-gray-950 border border-gray-800 p-3 rounded-xl cursor-pointer transition">
                    <input type="radio" name="postType" value="coupang" checked class="accent-purple-600">
                    <span class="text-xs font-medium text-gray-300">🧾 내 쿠팡 리뷰 캡처로 상품 추천글</span>
                </label>
                <label class="type-opt flex items-center space-x-2 bg-gray-950 border border-gray-800 p-3 rounded-xl cursor-pointer transition">
                    <input type="radio" name="postType" value="product" class="accent-purple-600">
                    <span class="text-xs font-medium text-gray-300">🛍️ 제품 리뷰</span>
                </label>
                <label class="type-opt flex items-center space-x-2 bg-gray-950 border border-gray-800 p-3 rounded-xl cursor-pointer transition">
                    <input type="radio" name="postType" value="travel" class="accent-purple-600">
                    <span class="text-xs font-medium text-gray-300">✈️ 여행 리뷰</span>
                </label>
                <label class="type-opt flex items-center space-x-2 bg-gray-950 border border-gray-800 p-3 rounded-xl cursor-pointer transition">
                    <input type="radio" name="postType" value="daily" class="accent-purple-600">
                    <span class="text-xs font-medium text-gray-300">🏠 육아·생활 팁</span>
                </label>
                <label class="type-opt flex items-center space-x-2 bg-gray-950 border border-gray-800 p-3 rounded-xl cursor-pointer transition">
                    <input type="radio" name="postType" value="deeppick" class="accent-purple-600">
                    <span class="text-xs font-medium text-gray-300">🔎 케이맘 딥픽</span>
                </label>
            </div>
        </div>

        <!-- Photo Section (딥픽이 아닐 때만 보임) -->
        <div id="photoSection" class="bg-gray-900/80 border border-gray-800/80 rounded-2xl p-5 shadow-xl">
            <div class="flex items-center justify-between mb-3">
                <span class="text-sm font-semibold text-gray-200 flex items-center space-x-2">
                    <i class="fa-regular fa-images text-sky-400"></i>
                    <span><span id="photoTitle">내 사진</span> <span id="photoCount" class="text-gray-500 font-normal">(0장)</span></span>
                </span>
                <label class="text-xs text-gray-200 bg-gray-800 px-3 py-1.5 rounded-lg border border-gray-700 cursor-pointer flex items-center space-x-1.5">
                    <i class="fa-solid fa-plus text-sky-400"></i>
                    <span>사진 추가</span>
                    <input type="file" id="photoInput" accept="image/*" multiple class="hidden">
                </label>
            </div>
            <p class="text-[11px] text-gray-500 mb-3 leading-relaxed">사진은 크기를 줄이고 위치정보(GPS)를 지운 뒤 <b class="text-gray-400">kmom-날짜-번호.jpg</b> 이름으로 바뀌어요. 사진마다 짧은 메모를 남기면 글에 반영돼요.</p>
            <div id="photoList" class="space-y-3"></div>
            <button id="sharePhotosBtn" onclick="sharePhotos()" class="hidden w-full mt-4 bg-sky-600 hover:bg-sky-500 text-white text-sm font-bold py-3 rounded-xl transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-share-nodes"></i>
                <span>사진 보내기 (카톡 나와의 채팅 등)</span>
            </button>
        </div>

        <!-- Channel Select Section -->
        <div class="bg-gray-900/80 border border-gray-800/80 rounded-2xl p-5 shadow-xl">
            <span class="text-sm font-semibold text-gray-200 block mb-3">포함할 콘텐츠 선택:</span>
            <div class="grid grid-cols-2 gap-3">
                <label class="flex items-center space-x-3 bg-gray-950 border border-gray-800 p-3 rounded-xl cursor-pointer hover:border-purple-500/50 transition">
                    <input type="checkbox" id="chkWp" checked class="w-4 h-4 text-purple-600 rounded bg-gray-900 border-gray-700 focus:ring-purple-500">
                    <span class="text-xs font-medium text-gray-300">워드프레스 포스팅</span>
                </label>
                <label class="flex items-center space-x-3 bg-gray-950 border border-gray-800 p-3 rounded-xl cursor-pointer hover:border-purple-500/50 transition">
                    <input type="checkbox" id="chkNaver" checked class="w-4 h-4 text-purple-600 rounded bg-gray-900 border-gray-700 focus:ring-purple-500">
                    <span class="text-xs font-medium text-gray-300">네이버 블로그</span>
                </label>
                <label class="flex items-center space-x-3 bg-gray-950 border border-gray-800 p-3 rounded-xl cursor-pointer hover:border-purple-500/50 transition">
                    <input type="checkbox" id="chkShort" checked class="w-4 h-4 text-purple-600 rounded bg-gray-900 border-gray-700 focus:ring-purple-500">
                    <span class="text-xs font-medium text-gray-300">숏폼 대본 (쇼츠/릴스)</span>
                </label>
                <label class="flex items-center space-x-3 bg-gray-950 border border-gray-800 p-3 rounded-xl cursor-pointer hover:border-purple-500/50 transition">
                    <input type="checkbox" id="chkCard" checked class="w-4 h-4 text-purple-600 rounded bg-gray-900 border-gray-700 focus:ring-purple-500">
                    <span class="text-xs font-medium text-gray-300">인스타 카드뉴스</span>
                </label>
            </div>
        </div>

        <!-- Action Button -->
        <button onclick="generateCommand()" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold py-4 px-6 rounded-2xl shadow-xl shadow-purple-600/30 transition transform active:scale-95 flex items-center justify-center space-x-2">
            <i class="fa-solid fa-terminal text-lg"></i>
            <span>CLI 명령어 자동 생성하기</span>
        </button>

        <!-- Result / Output Modal or Box -->
        <div id="resultBox" class="hidden bg-gray-900 border border-purple-500/40 rounded-2xl p-4 shadow-2xl">
            <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-bold text-purple-400 uppercase tracking-wider">생성된 CLI 명령어</span>
                <button onclick="copyCommand()" class="text-xs bg-purple-600 hover:bg-purple-500 text-white px-3 py-1 rounded-lg transition font-medium">
                    <i class="fa-regular fa-copy mr-1"></i> 복사하기
                </button>
            </div>
            <div id="commandOutput" class="bg-gray-950 p-3 rounded-xl text-xs font-mono text-gray-300 break-all select-all border border-gray-800"></div>
        </div>

    </main>

    <!-- Footer Guide -->
    <footer class="w-full text-center py-4 mt-6 border-t border-gray-800/80">
        <p class="text-xs text-gray-400">사파리/크롬 메뉴에서 <span class="text-purple-400 font-semibold">'홈 화면에 추가'</span>를 누르시면 앱처럼 연결됩니다.</p>
    </footer>

    <!-- Toast Message -->
    <div id="toast" class="fixed bottom-20 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white text-xs px-4 py-2.5 rounded-full shadow-2xl opacity-0 pointer-events-none transition duration-300 border border-gray-700">
        클립보드에 복사되었습니다!
    </div>

    <script>
        const TYPE_LABELS = { coupang: '내 쿠팡 리뷰 캡처 기반 상품 추천', product: '제품 리뷰', travel: '여행 리뷰', daily: '육아·생활 팁', deeppick: '케이맘 딥픽' };
        const MAX_PHOTOS = 20;
        const MAX_WIDTH = 1600;  // 가로 기준으로만 줄인다: 세로로 긴 리뷰 캡처도 글자가 읽히게
        let photos = [];         // { blob: 변환된 jpg, url: 미리보기 주소, memo: '' }
        let batchId = '';        // 한 번에 고른 사진 묶음을 구분하는 짧은 코드

        // 명령어가 "..." 로 감싸지므로 큰따옴표와 줄바꿈은 안전한 글자로 바꾼다.
        function clean(text) {
            return text.replace(/"/g, "'").replace(/\s*\n\s*/g, ' ').trim();
        }

        function currentType() {
            return document.querySelector('input[name="postType"]:checked').value;
        }

        function updateTypeUI() {
            const type = currentType();
            document.querySelectorAll('.type-opt').forEach(label => {
                const on = label.querySelector('input').checked;
                label.classList.toggle('border-purple-500', on);
                label.classList.toggle('border-gray-800', !on);
            });
            document.getElementById('photoSection').classList.toggle('hidden', type === 'deeppick');
            const isCoupang = type === 'coupang';
            document.getElementById('photoTitle').innerText = isCoupang ? '쿠팡 리뷰 캡처' : '내 사진';
            document.querySelectorAll('.memo').forEach(m => { m.placeholder = memoHint(); });
        }

        function memoHint() {
            return currentType() === 'coupang' ? '예: 2024년 3월 구매, 아직 사용 중' : '예: 개봉 직후 구성품';
        }

        function todayStamp() {
            const d = new Date();
            return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
        }

        function photoName(index) {
            return `kmom-${todayStamp()}-${batchId}-${String(index + 1).padStart(2, '0')}.jpg`;
        }

        // 캔버스로 다시 그려 저장하면 크기가 줄고 GPS 같은 사진 정보(EXIF)가 빠진다.
        function convertPhoto(file) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const src = URL.createObjectURL(file);
                img.onload = () => {
                    const scale = Math.min(1, MAX_WIDTH / img.naturalWidth);
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.round(img.naturalWidth * scale);
                    canvas.height = Math.round(img.naturalHeight * scale);
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    URL.revokeObjectURL(src);
                    canvas.toBlob(blob => blob ? resolve(blob) : reject(), 'image/jpeg', 0.9);
                };
                img.onerror = () => { URL.revokeObjectURL(src); reject(); };
                img.src = src;
            });
        }

        async function addPhotos(fileList) {
            if (!batchId) batchId = Math.random().toString(36).slice(2, 6);
            const files = Array.from(fileList).slice(0, MAX_PHOTOS - photos.length);
            if (fileList.length > files.length) showToast(`사진은 최대 ${MAX_PHOTOS}장까지 넣을 수 있어요.`);
            let failed = 0;
            for (const file of files) {
                try {
                    const blob = await convertPhoto(file);
                    photos.push({ blob, url: URL.createObjectURL(blob), memo: '' });
                } catch (e) {
                    failed++;
                }
            }
            if (failed) showToast(`${failed}장은 열 수 없는 형식이라 빠졌어요.`);
            renderPhotos();
        }

        function removePhoto(index) {
            URL.revokeObjectURL(photos[index].url);
            photos.splice(index, 1);
            renderPhotos();
        }

        function renderPhotos() {
            const list = document.getElementById('photoList');
            list.innerHTML = '';
            photos.forEach((p, i) => {
                const row = document.createElement('div');
                row.className = 'flex items-start space-x-3 bg-gray-950 border border-gray-800 rounded-xl p-2.5';
                row.innerHTML = `
                    <div class="relative shrink-0">
                        <img src="${p.url}" class="w-16 h-16 object-cover rounded-lg">
                        <span class="absolute -top-1.5 -left-1.5 bg-sky-600 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center">${i + 1}</span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-[10px] text-gray-500 font-mono truncate mb-1">${photoName(i)}</p>
                        <input type="text" placeholder="${memoHint()}" class="memo w-full bg-gray-900 border border-gray-800 rounded-lg px-2.5 py-1.5 text-xs text-gray-100 placeholder-gray-600 focus:outline-none focus:border-sky-500">
                    </div>
                    <button class="text-gray-500 hover:text-red-400 px-1" aria-label="사진 빼기"><i class="fa-solid fa-xmark"></i></button>`;
                const memo = row.querySelector('.memo');
                memo.value = p.memo;
                memo.addEventListener('input', () => { p.memo = memo.value; });
                row.querySelector('button').addEventListener('click', () => removePhoto(i));
                list.appendChild(row);
            });
            document.getElementById('photoCount').innerText = `(${photos.length}장)`;
            document.getElementById('sharePhotosBtn').classList.toggle('hidden', photos.length === 0);
        }

        function photoFiles() {
            return photos.map((p, i) => new File([p.blob], photoName(i), { type: 'image/jpeg' }));
        }

        async function sharePhotos() {
            const files = photoFiles();
            if (navigator.canShare && navigator.canShare({ files })) {
                try {
                    await navigator.share({ files, title: '케이맘픽스 사진' });
                    showToast('사진을 보냈어요! PC에서 받은 파일을 저장해 두세요.');
                } catch (e) {
                    // 사용자가 공유 창을 닫은 경우: 아무것도 하지 않는다
                }
                return;
            }
            // 공유 기능이 없는 브라우저는 한 장씩 내려받기로 대신한다.
            files.forEach(file => {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(file);
                a.download = file.name;
                a.click();
                setTimeout(() => URL.revokeObjectURL(a.href), 1000);
            });
            showToast('이 브라우저는 공유가 안 돼서 사진을 내려받았어요.');
        }

        function generateCommand() {
            const topic = clean(document.getElementById('topicInput').value);
            if(!topic) {
                alert('오늘의 주제나 아이디어를 입력해주세요!');
                return;
            }
            const type = currentType();
            const wp = document.getElementById('chkWp').checked;
            const naver = document.getElementById('chkNaver').checked;
            const short = document.getElementById('chkShort').checked;
            const card = document.getElementById('chkCard').checked;

            let channels = [];
            if(wp) channels.push("워드프레스");
            if(naver) channels.push("네이버블로그");
            if(short) channels.push("숏폼대본");
            if(card) channels.push("카드뉴스");

            const mode = type === 'deeppick' ? '케이맘 딥픽 모드' : `일반 모드 · ${TYPE_LABELS[type]}`;
            let photoPart = '';
            if (type !== 'deeppick' && photos.length) {
                const first = photoName(0), last = photoName(photos.length - 1);
                const memos = photos.map((p, i) => p.memo.trim() ? `${i + 1}번: ${clean(p.memo)}` : '').filter(Boolean);
                const what = type === 'coupang' ? '내 쿠팡 리뷰 캡처' : '내 사진';
                photoPart = ` / ${what} ${photos.length}장: ${first}${photos.length > 1 ? ` ~ ${last.slice(-6)}` : ''}`
                    + ' (PC의 다운로드·카카오톡 받은 파일 폴더에서 찾아 사용)'
                    + (memos.length ? ` / 사진 메모: ${memos.join(', ')}` : '');
            }

            const cmd = `claude -p "케이맘픽스 주제: ${topic} / 글 종류: ${mode}${photoPart} / 생성 채널: ${channels.join(', ')} 에 맞춰 마스터 지침(RULE.md) 기반 콘텐츠 5종 세트를 즉시 작성해줘."`;
            
            document.getElementById('commandOutput').innerText = cmd;
            document.getElementById('resultBox').classList.remove('hidden');
            showToast('CLI 명령어가 생성되었습니다!');
        }

        function copyCommand() {
            const text = document.getElementById('commandOutput').innerText;
            navigator.clipboard.writeText(text).then(() => {
                showToast('클립보드에 복사되었습니다!');
            });
        }

        function startVoiceInput() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('이 브라우저는 음성 입력을 지원하지 않습니다. 텍스트로 직접 입력해 주세요.');
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'ko-KR';
            recognition.start();
            
            showToast('음성 인식을 시작합니다...');

            recognition.onresult = function(event) {
                const speechToText = event.results[0][0].transcript;
                document.getElementById('topicInput').value = speechToText;
                showToast('음성 입력이 완료되었습니다!');
            };

            recognition.onerror = function() {
                showToast('음성 인식에 실패했습니다.');
            };
        }

        document.querySelectorAll('input[name="postType"]').forEach(r => r.addEventListener('change', updateTypeUI));
        document.getElementById('photoInput').addEventListener('change', e => {
            addPhotos(e.target.files);
            e.target.value = '';   // 같은 사진을 다시 고를 수 있게 비워 둔다
        });
        updateTypeUI();

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2500);
        }
    </script>
</body>
</html>
