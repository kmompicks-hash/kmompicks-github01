<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="kmom-size" content="1080x1080">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1080px; height: 1080px; overflow: hidden; background: #f8f5e6; }
  .ring { position: absolute; left: 90px; top: 90px; width: 900px; height: 900px; border-radius: 50%; border: 6px solid #7f9886; box-sizing: border-box; }
  .ring2 { position: absolute; left: 118px; top: 118px; width: 844px; height: 844px; border-radius: 50%; border: 3px solid #7f9886; box-sizing: border-box; }
  .wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #7f9886; font-family: 'Cormorant Garamond', serif; }
  .km { font-size: 400px; font-weight: 600; line-height: .9; letter-spacing: 6px; }
  .name { font-size: 76px; font-weight: 600; letter-spacing: 4px; margin-top: 30px; display: flex; align-items: center; gap: 26px; }
  .name i { width: 13px; height: 13px; border-radius: 50%; background: #7f9886; display: inline-block; }
  .tag { font-size: 46px; font-weight: 500; letter-spacing: 3px; margin-top: 14px; }
</style></head>
<body>
  <div class="ring"></div><div class="ring2"></div>
  <div class="wrap">
    <div class="km">KM</div>
    <div class="name"><i></i>KMomPicks<i></i></div>
    <div class="tag">Trusted Choices</div>
  </div>
</body></html>
